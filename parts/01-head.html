<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ============ SEO ============ -->
<!-- تُستبدل تلقائيًا من assets/js/site.config.js عند التشغيل: npm run build -->
<title>{{site.title}}</title>
<meta name="description" content="{{site.description}}">
<meta name="keywords" content="{{site.keywords}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#061C16">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="{{site.url}}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.shortName}}">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="{{site.title}} 🤍">
<meta property="og:description" content="{{dua.intro}}">
<meta property="og:url" content="{{site.url}}">
<meta property="og:image" content="assets/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{site.title}}">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{site.title}} 🤍">
<meta name="twitter:description" content="{{dua.intro}}">
<meta name="twitter:image" content="assets/icons/og-image.png">

<!-- ============ PWA (#47) ============ -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{site.shortName}}">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<!-- ============ الخطوط ============ -->
<!-- ملاحظة: لا نُحمّل الخطوط بشكل حاجب. media="print" مع onload ممنوع تحت CSP صارم،
     لذا نُحمّلها عبر <link rel="preload"> ثم نُفعّلها من JS (main.js → initFonts). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontCss" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri+Quran&display=swap">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri+Quran&display=swap">
</noscript>

<link rel="stylesheet" href="assets/css/main.css">

<!-- ============ الإعدادات المحلية (اختياري، غير مُدرج في Git) ============ -->
<!-- لإنشاء هذا الملف انسخ assets/js/env.local.example.js
     يُستخدم لتحديد رابط صوت سورة يس دون تعديل أي كود -->
<script src="assets/js/env.local.js" onerror="this.remove()"></script>
